<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Solar System Explorer</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
                "jsm/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info-panel" class="info-panel">
        <h2>Solar System Explorer</h2>
        <p>Hover over planets to see names, click for details!</p>
        <div id="planet-info"></div>
    </div>
    <div id="controls" class="controls">
        <button id="reset-camera">Reset Camera</button>
        <button id="toggle-orbits">Toggle Orbits</button>
        <button id="toggle-rotation">Toggle Rotation</button>
    </div>
    
    <!-- Simple Tooltip -->
    <div id="tooltip" class="tooltip"></div>
    
    <script type="module" src="index.js"></script>
</body>
</html>
